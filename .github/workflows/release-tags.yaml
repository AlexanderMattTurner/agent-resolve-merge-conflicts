name: Release tags

# This repository publishes no package: a caller reaches the reusable workflow by
# SHA, so the git tag IS the release. On every push to the default branch, decide
# a Conventional-Commits bump from the commits since the last vX.Y.Z tag, tag it,
# and advance the moving major tag (v1) to the same commit.
#
# The suites run BEFORE anything is tagged, in the same job, so a release is cut
# only from a tree whose tests were seen to pass rather than one whose PR checks
# are assumed to have. Both tags then land on the `chore(release)` commit made
# after that run, which differs from the tested tree by CHANGELOG.md alone.
# Nothing is published, so a failure leaves both tags where they were.
#
# RELEASE_DRY_RUN defaults to "false", so every push to the default branch that
# carries a releasable commit cuts a tag. Set the repository variable to any
# other value to park the flow: the script then prints the version it would cut
# and creates no tag. The script's own default stays dry, so a run with the
# variable unset entirely — a local invocation — still tags nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-tags
  cancel-in-progress: false
  # static-concurrency-ok: not a required check (push/dispatch only)

permissions:
  contents: read

jobs:
  release:
    name: Tag a release and advance the major tag
    # `workflow_dispatch` offers every branch. The script checks the VERSION but
    # not the ref, and it pushes `HEAD` — so without this a dispatch from a
    # feature branch tags that branch and moves the major tag onto it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # creates the vX.Y.Z tag and moves the major tag
    steps:
      - name: Checkout
        # Credentials stay persisted: release-tag.sh pushes the release-docs
        # commit and both tags with them. main is protected by a required-status
        # ruleset and the release-docs commit is `[skip ci]`, so it can never
        # satisfy those checks — the stock GITHUB_TOKEN is not a ruleset bypass
        # actor and its push is rejected with GH013. TEMPLATE_SYNC_TOKEN_ORG is
        # the org PAT registered as a bypass actor; fall back to GITHUB_TOKEN
        # only when it is UNSET (a fork), because `||` falls back on an empty
        # value and a token that is SET but unauthorized is still truthy.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # Full history so `git describe` can find the last tag.
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }} # token-fallback-ok: the fork path has no org PAT and must fall back to GITHUB_TOKEN; the step comment above states why `||` is safe only on an UNSET secret

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          # The repository suite below runs under `uv`, and this input defaults
          # to false — without it the release step dies on "uv: command not
          # found" on every push to the default branch.
          setup-python: true

      - name: Run the resolver suite
        run: node --test .github/resolver/auto-resolve/*.test.mjs

      - name: Run the repository suite
        run: uv run --extra dev pytest tests/ -q

      - name: Tag the release and advance the major tag
        id: release
        env:
          # Repository variables, so a human flips the dry run and renames the
          # major tag without editing a synced file.
          RELEASE_DRY_RUN: ${{ vars.RELEASE_DRY_RUN || 'false' }}
          RELEASE_MAJOR_TAG: ${{ vars.RELEASE_MAJOR_TAG || 'v1' }}
        run: bash .github/scripts/release-tag.sh

name: Claude reviewers

# Umbrella for the two automated PR reviewers: the first-pass reviewer (the
# `review` job, a CALL into AlexanderMattTurner/agent-review, which now owns the
# reviewer) and the merge-delta reviewer (the `merge_delta_review` job).
# One file holds both to cut the per-PR workflow fan-out on a shared, capped
# runner pool. Each job stays self-contained and carries its own SECURITY header,
# `permissions:` and `if:` guards. Both run on the reviewers' shared
# pull_request_target trigger with a base-only checkout and a least-privilege
# token. Concurrency is declared PER JOB (never workflow-level), keeping each
# reviewer's own group name so the jobs never cancel one another.
#
# The merge-conflict auto-resolver stays a SEPARATE file
# (auto-resolve-conflicts.yaml): it checks out the PR HEAD to merge into it, and
# co-locating a head checkout with pull_request_target trips CodeQL's
# untrusted-checkout query (file-scoped, blind to per-job event gating) and would
# blind that query to these secrets-bearing reviewer jobs.

on: # zizmor: ignore[dangerous-triggers] — reviewer jobs are base-only checkout + least privilege; see each job's header
  # `opened`/`ready_for_review`/`synchronize` drive the first-pass reviewer, the
  # skipped-PR note and the merge-delta reviewer. `labeled` carries two hatches:
  # `needs-auto-review` for the first-pass reviewer, and `review-gate-recheck` for
  # the note and the approval, whose own events a PR opened under GITHUB_TOKEN
  # never raised. Each job's `if:` re-scopes it
  # to its own events. Because pull_request_target always runs the workflow file
  # from the base branch, these reviewers only take effect once merged to the
  # default branch.
  pull_request_target: # not-required-check
    types: [opened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Claude PR review (first pass) — the `review` job
  #
  # The reviewer itself now lives in AlexanderMattTurner/agent-review as a
  # reusable workflow, and this job only CALLS it. That repository holds the
  # whole reviewer: the one-read-per-PR budget, the per-file split for a diff
  # that outgrows one model context, the input sanitizer, the credential ladder
  # and the posting path. Its scripts run from the commit the `uses:` line pins,
  # cloned from a repository a pull request here cannot write, so the tree under
  # review can no longer rewrite the code that reviews it.
  #
  # Two pieces stay HERE, because the reviewer takes each as an input: the review
  # prompt (.github/prompts/claude-pr-review.md) and the review-findings merge
  # gate (review_findings_gate.py) that the review's threads feed.
  #
  # SECURITY — the called workflow's own header states the posture in full: a
  # base-only checkout, the PR's changes read only as sanitized DATA, and least
  # privilege per job. The `permissions:` block below is the CEILING those jobs
  # are narrowed from, never a grant — GitHub lets a called workflow request only
  # what the calling job holds, so a caller that grants less ends the run in
  # `startup_failure` before any job starts.
  #
  # THE TITLE SKIP IS GATED ON A TRUSTED AUTHOR, and the same guard appears
  # verbatim on note-skipped-review below. A PR title is written by the PR
  # AUTHOR, so on its own it is an attacker-chosen string that decides whether
  # this repo reviews the PR at all: an outside contributor titling a fork PR
  # `chore: bump` would skip the real read with one string. The guard is the pair
  # GitHub sets, not the author: `head.repo.full_name` (same-repo branch, so the
  # author already has push access) or `author_association` in
  # OWNER/MEMBER/COLLABORATOR.
  #
  # It must gate BOTH jobs or neither. Guarding only the note leaves an untrusted
  # `chore:` PR skipped here and noted by nobody, so the review-findings gate
  # holds it at `pending` with no event able to clear it. Guarded on both, the
  # skip set is simply EMPTY for an untrusted author: their PR always gets the
  # real review, whatever its title.
  #
  # This `if:` carries the cheap payload-only skips (no runner boots for a
  # draft/bot/chore PR); the called workflow's own decide job then spends the
  # one-read-per-PR budget, reviewing on `opened` and re-arming on a
  # `ready_for_review` or `synchronize` that still owes a read.
  # ────────────────────────────────────────────────────────────────────────────
  review:
    # The skip set below, OR the on-demand label the skip notice offers. The
    # reviewer's own decide script answers a `labeled` event only for that label,
    # so every other label edit costs one skipped job. The bot guard rides the
    # label arm too: claude-code-action refuses a Bot-initiated run outright, so
    # a labelled bot PR would walk every credential rung and fail each one
    # identically, for a cause no token changes. note-skipped-review.sh withholds
    # the label offer from a bot PR for the same reason.
    if: >-
      (
      github.event.label.name == 'needs-auto-review' &&
      github.event.pull_request.user.type != 'Bot'
      ) ||
      (
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        !(
          github.event.pull_request.head.repo.full_name == github.repository ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        ) ||
        (
          !startsWith(github.event.pull_request.title, 'chore:') &&
          !startsWith(github.event.pull_request.title, 'chore(') &&
          !startsWith(github.event.pull_request.title, 'style:') &&
          !startsWith(github.event.pull_request.title, 'style(') &&
          !startsWith(github.event.pull_request.title, 'release:') &&
          !startsWith(github.event.pull_request.title, 'release(')
        )
      )
      )
    permissions:
      contents: read # the reviewer checks out this repository's default branch
      pull-requests: write # post the review
      statuses: write # review_findings_gate.py re-posts this head's verdict
      actions: read # the owed-review re-check lists this workflow's in-flight runs
      checks: read # the gate re-post reads the merge-delta reviewer's check run
    uses: AlexanderMattTurner/agent-review/.github/workflows/review.yaml@187352c44e437e619f81ed3f486080b0fdab93df # pin-comment-ok: agent-review cuts no release yet; re-pin at its first vX.Y
    with:
      reviewer-repository: AlexanderMattTurner/agent-review
      # Whole-diff reads one PR may spend, ever. Explicit rather than inherited:
      # the called workflow defaults it to 1, and a caller that leans on that
      # default re-prices every PR here if the default ever moves.
      max-reviews-per-pr: 1
      # The reviewer counts a whole-diff read by a stamp only this pin writes. The
      # pin bumped at 2026-09-02T23:53Z, so every PR read before then looks unread
      # and its next push buys a second read. This date says those were reads.
      # Delete it once no open PR predates it.
      reads-marked-from: "2026-09-03T00:00:00Z"
      # The same sha the `uses:` line above pins, kept in step by check-lockstep-pins.
      # Leaving it unset reads that pin out of `github.job_workflow_sha`, which arrived
      # EMPTY on the first run of this config: the reviewer's own guard refused rather
      # than clone an unpinned default branch, so the required review check went red
      # before any review ran (run 32988186467).
      reviewer-ref: 187352c44e437e619f81ed3f486080b0fdab93df
      review-prompt: .github/prompts/claude-pr-review.md
      # The review posts with the workflow GITHUB_TOKEN, whose events fire no
      # workflows, so the required "Review findings resolved" check never hears
      # about the review unless this re-posts its verdict on the head.
      #
      # allow-path-shadowed-interpreter: the reviewer's jobs install no venv of
      # this repository's, and the gate's import closure is stdlib-only.
      # The regenerated files this repository commits carry no finding a reviewer
      # can act on, and the reviewer's budget is diff lines.
      elide-command: bash .github/scripts/elide-generated-diff.sh "$1"
      post-review-command: python3 .github/scripts/review_findings_gate.py
    secrets:
      # FAR_ANTHROPIC_API_KEY fills the first tier: this run spends the metered
      # key unconditionally, reaches the dedicated tokens only once that key
      # errors, and reaches CLAUDE_CODE_OAUTH_TOKEN — the maintainer's personal
      # account — last, once every dedicated token is dead. The order is
      # .github/resolver/lib/shared-names.json's `oauth_ladder_vars`.
      rung_1: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
      rung_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      rung_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
      rung_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
      rung_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
      rung_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
      rung_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
      rung_8: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Note the PRs the reviewer deliberately SKIPS (see `review` above: low-risk
  # chore/style by title, machine-cut `release:` PRs, and bot-authored PRs like
  # Dependabot). The review-findings gate holds every PR until the reviewer has
  # completed at least one review, so a class it never reads would sit at `pending`
  # with no thread anyone could resolve. This posts a COMMENT review — no vote, no
  # finding — which clears that leg. Draft
  # PRs are excluded: they can't merge anyway and get reviewed on
  # `ready_for_review`. Fires only on the first-look events
  # (opened/ready_for_review), never on `synchronize`: one note per PR is all the
  # gate's first leg needs.
  #
  # The author fields come from the event payload, which GitHub sets and the
  # triggering actor cannot spoof: `user.type`, `author_association` and
  # `head.repo.full_name` all mean what they say. THE TITLE DOES NOT — the PR
  # author writes it and can rewrite it at will — so the title arm below is
  # gated on the same trusted-author guard the `review` job carries, and the two
  # guards must stay identical (see the review job's header for why guarding one
  # alone strands the PR). The bot arm needs no such guard: `user.type == 'Bot'` is a
  # payload fact, and `review` skips bot PRs on exactly the same fact, so the two
  # jobs agree on that class already.
  #
  # This posts a review and re-posts the gate verdict; it runs no PR code.
  note-skipped-review:
    name: Note the low-risk and bot PRs the reviewer skips
    # `synchronize` is here so a PR that missed its `opened` window still gets the
    # note. Under pull_request_target the OPENED event runs the BASE's workflow
    # file, so every skipped PR opened before this job existed on the default
    # branch could never satisfy the gate's reviewed-at-all leg, and no later event
    # re-delivered it — #30 stranded that way with auto-merge armed. The script
    # no-ops when the reviewer already has a review, so a push posts no second note.
    if: >-
      (
        github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'synchronize' ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'review-gate-recheck'
        )
      ) &&
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.type == 'Bot' ||
        (
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
          ) &&
          (
            startsWith(github.event.pull_request.title, 'chore:') ||
            startsWith(github.event.pull_request.title, 'chore(') ||
            startsWith(github.event.pull_request.title, 'style:') ||
            startsWith(github.event.pull_request.title, 'style(') ||
            startsWith(github.event.pull_request.title, 'release:') ||
            startsWith(github.event.pull_request.title, 'release(')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse-checkout the trusted scripts
      pull-requests: write # post the COMMENT review; read the PR's reviews and threads
      statuses: write # re-post the review-findings gate verdict after the note lands
      checks: read # the gate re-post reads the merge-delta reviewer's check run on the head
    steps:
      - name: Checkout base (trusted) scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch only (trusted) — never the untrusted PR head, and
          # never base.ref, which a PR author can write. Matches the reviewer's
          # own posture: the script is trusted repo content, no PR code runs.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/resolver
            config
          sparse-checkout-cone-mode: false
      - name: Post the note that clears the gate's reviewed-at-all leg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # A payload fact GitHub sets, which the actor cannot spoof. It decides
          # which sentence the note ends on: a bot-authored PR cannot be
          # Claude-reviewed at all.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: bash .github/scripts/note-skipped-review.sh
      - name: Re-evaluate the review-findings gate on the head
        # The note is posted with the workflow GITHUB_TOKEN, whose events fire no
        # workflows, so review-findings-gate.yaml never hears about it. Without this
        # step a skipped PR nobody pushes to again keeps the gate's pre-note verdict
        # forever.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
        # allow-path-shadowed-interpreter: this job installs no venv, so there is no
        # repo interpreter to name, and the gate's import closure is stdlib-only.
        run: python3 .github/scripts/review_findings_gate.py

  # ────────────────────────────────────────────────────────────────────────────
  # Landing the skipped class — `auto-approve-skipped`
  #
  # note-skipped-review above clears the review-findings gate for this class, but
  # the PR still needs an approving review. The reviewer's own APPROVE vote
  # supplies one for every PR it reads. A class the reviewer never reads gets
  # none, so a machine-cut `chore(release)` PR strands on a review-required
  # ruleset with every required check green.
  #
  # The gate status stays with note-skipped-review, which posts the REAL verdict
  # through review_findings_gate.py. A success status posted from here would
  # publish green over a chore PR that took the `needs-auto-review` label and
  # earned a gating finding.
  #
  # THE TRUST GUARD IS WHAT STOPS A PR FROM APPROVING ITSELF. This job requires a
  # same-repo head on EVERY arm, the bot arm included: `user.type == 'Bot'` is an
  # authentic payload fact, but it names an account TYPE and not a trusted
  # identity, so any external App bot could otherwise open a fork PR and take the
  # approval. That makes this set a strict subset of note-skipped-review's, which
  # is the invariant that matters: nothing is approved whose gate nothing clears.
  #
  # This workflow does NOT arm auto-merge. Arming belongs to the flow that OPENS
  # a PR: template-sync-automerge.sh refuses to arm a sync whose conflict a model
  # resolved, and dependabot-auto-merge.yaml refuses a semver-major bump. A
  # reviewer-side job that armed every skipped PR overrode both refusals.
  #
  # ────────────────────────────────────────────────────────────────────────────
  auto-approve-skipped:
    name: Approve the low-risk and bot PRs the reviewer skips
    # not-required-check: posts a review, reports no verdict about the code.
    #
    # `synchronize` too, matching note-skipped-review: under pull_request_target
    # the `opened` event runs the BASE workflow file, so a PR already open when
    # this job reaches the default branch never sees it and no later event
    # re-delivers `opened`. auto-approve-skipped-pr.sh is idempotent — it exits 0
    # on a PR that already carries the approval, or whose approval a reviewer
    # dismissed on purpose — so the wider trigger re-posts nothing.
    if: >-
      (
        contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'review-gate-recheck'
        )
      ) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.type == 'Bot' ||
        startsWith(github.event.pull_request.title, 'chore:') ||
        startsWith(github.event.pull_request.title, 'chore(') ||
        startsWith(github.event.pull_request.title, 'style:') ||
        startsWith(github.event.pull_request.title, 'style(') ||
        startsWith(github.event.pull_request.title, 'release:') ||
        startsWith(github.event.pull_request.title, 'release(')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse-checkout the trusted approval script
      pull-requests: write # submit the approving review
    steps:
      - name: Checkout base (trusted) approval script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch only (trusted) — never the untrusted PR head, and never
          # base.ref, which a PR author can write. Matches the jobs above.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/auto-approve-skipped-pr.sh
          sparse-checkout-cone-mode: false
      - name: Approve so a review-required ruleset does not strand a skipped PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/auto-approve-skipped-pr.sh

  # ────────────────────────────────────────────────────────────────────────────
  # Claude merge-delta review — the `merge_delta_review` job
  #
  # A dedicated reviewer for a PR's hand-authored MERGE-RESOLUTION deltas
  # (`git show --remerge-diff`) — the one channel through which a conflict
  # resolution can introduce content present in neither parent (an "evil merge")
  # that the ordinary PR diff never isolates. Separate from the first-pass
  # reviewer (the review job) and the thread-resolver: those read the net
  # diff and so share the blind spot this closes.
  #
  # ────────────────────────────────────────────────────────────────────────────
  merge_delta_review:
    name: Review the PR's merge-resolution deltas
    # Skip drafts (can't merge) and bot-authored PRs (never Claude-reviewed).
    if: >-
      contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One review per PR at a time; a newer push supersedes an in-flight run (latest
    # head wins). Keyed by PR number, so it never strands a required check.
    concurrency:
      group: claude-merge-delta-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the trusted base commit
      pull-requests: write # post the advisory comment
      statuses: write # re-post the review-findings gate verdict after the review lands
      checks: read # the re-post's exemption is conditional, so it can still read the head's check runs
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base (trusted) branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch (trusted repo content), never the untrusted PR head
          # and never the author-writable base.ref — same rationale as the
          # review job. fetch-depth: 0 so the merge-base of the PR head
          # (fetched as objects) resolves.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the input sanitizer
        # Self-contained install (into .github/scripts/node_modules) so repos
        # synced from the template need no sanitizer entry in their own
        # package.json. --ignore-scripts keeps the install hermetic.
        run: bash .github/scripts/install-input-sanitizer.sh

      - name: Locate the resolver
        id: resolver
        env:
          RESOLVER_REPOSITORY: AlexanderMattTurner/agent-resolve-merge-conflicts
          # The resolver paths this job's steps name: the renderer
          # (prepare-merge-delta-input.sh), and the verdict and comment
          # libraries post-merge-delta-review.sh sources. The served tree
          # is a whole commit — the DEFAULT BRANCH checked out above, or a clone
          # at the caller's pin in a consumer — so listing the renderer's
          # imports would refuse a consumer whose pin predates one of them.
          RESOLVER_PATHS: remerge-diff-report.py lib/merge-delta-verdict.bash lib-ci-retry.sh lib-marker-comment.sh
        run: bash .github/scripts/resolver-dir.sh

      - name: Render and sanitize the merge-resolution deltas
        id: prepare
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          RESOLVER_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: bash .github/scripts/prepare-merge-delta-input.sh

      - name: Review the merge deltas with Claude
        id: review
        if: steps.prepare.outputs.has_deltas == 'true'
        uses: ./.github/actions/claude-run
        with:
          # CLAUDE_CODE_OAUTH_TOKEN fills the LAST tier: it is the account an
          # operator already has, so CI spends every token provisioned for CI
          # first. A tier left unset is skipped, so a setup that configures only
          # that one secret reaches it with no wasted attempt.
          api_key: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Give the action the workflow token directly. Without it, the action
          # tries to mint one via an OIDC→GitHub-App token exchange that isn't
          # authorized here and fails with "401 Invalid OIDC token" before Claude
          # runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Review outside-contributor PRs too; safe for the same reasons as the
          # first-pass reviewer (base-only checkout, least-privilege token,
          # sanitized data-only input).
          allowed_non_write_users: "*"
          # This read GATES the merge: its finding reds the review-findings gate.
          model: claude-opus-5
          # Each tool rule carries a path: a bare tool name is a whole-tool grant
          # that overrides the per-path check, which makes --add-dir prompt
          # suppression rather than a boundary. `Read(./**)` governs Read, Grep
          # and Glob; `Edit(…)` governs Edit, Write and the notebook tools.
          # `runner.temp` is already absolute, so it takes no slash of its own —
          # the `/${{ runner.temp }}` this used to spell wrote `//home/...`, which
          # matched only because the rule matcher collapses the pair.
          #
          # pr-input needs its OWN Read rule. `--add-dir` widens the working set,
          # but with an explicit --allowedTools list a path still needs a matching
          # Read(...) grant, and merge-delta.txt lives there — untrusted_input only
          # NAMES that file, so the model has to read it itself or review nothing.
          claude_args: >-
            --setting-sources user
            --allowedTools "Read(./**),Read(${{ runner.temp }}/pr-input/**),Edit(${{ runner.temp }}/pr-input/**)"
            --add-dir "${{ runner.temp }}/pr-input"
          prompt: |
            You are the merge-delta reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/prompts/claude-merge-delta-review.md — it is the
            single source of truth for how to review and the exact merge-review.md format.

            Write your review to ${{ runner.temp }}/pr-input/merge-review.md — nothing else.
            Do not post comments, resolve threads, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_input: |
            merge deltas: ${{ runner.temp }}/pr-input/merge-delta.txt

      - name: Post the advisory merge-delta review
        # Runs whenever prepare SUCCEEDED — including has_deltas=false — so a
        # sticky comment about a since-removed merge is refreshed to the clean
        # verdict rather than left stale. Skipped when prepare failed loud (an
        # octopus / renderer error), where the red job IS the signal.
        id: post_review
        # always(), for the same reason as the gate step below. An implicit
        # success() skips this step whenever an EARLIER one reddened the job —
        # and the reviewer step is earlier, so the one state this step exists to
        # report (deltas present, reviewer died) is exactly the state that would
        # skip it. A skipped step's outcome is `skipped`, not `failure`, so the
        # gate below would then read MERGE_DELTA_VERDICT_IN_HAND as true and
        # publish green over a head nothing judged, leaving the stale clean
        # comment standing.
        if: always() && steps.prepare.conclusion == 'success'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          # From the RENDERER, not from whether the reviewer wrote a file. This
          # step runs even when the review step above went red, so an inferred
          # value would publish "no deltas" for a head whose reviewer died.
          HAD_DELTAS: ${{ steps.prepare.outputs.has_deltas }}
          # The deltas reach the model through ONE Read of merge-delta.txt, so a
          # denied Read means the verdict below it covers nothing. Empty is the
          # honest unknown — the reviewer was skipped or died before the gate ran
          # — and the file-absent branch already fails closed on both of those.
          DENIED_TOOLS: ${{ steps.review.outputs.permission_denied_tools }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          RESOLVER_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: bash .github/scripts/post-merge-delta-review.sh

      - name: Re-evaluate the review-findings gate on the head
        # This job's verdict is the gate's third term, and it is posted with the
        # workflow GITHUB_TOKEN, whose events fire no workflows. Without this step
        # the head keeps a verdict that says the merge deltas are unread.
        # always() for the same reason as the review job's re-post: an implicit
        # success() would skip this whenever an earlier step reddened the job, which
        # is exactly when the head's verdict is stale.
        if: always() && steps.prepare.conclusion == 'success'
        env:
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
          # This step runs AFTER the post step, so the verdict for this head is on
          # the PR — but this job's own check run is still in_progress, so the gate's
          # merge-delta term would read the head as unjudged and publish red over the
          # verdict just posted, with no later event to re-evaluate it.
          #
          # Two conditions, because the step's OUTCOME is not the claim. A post
          # that ran and published UNREVIEWED exits 0 and judged nothing, and a
          # SKIPPED post has outcome `skipped`, which is also not `failure` — so
          # keying on the outcome alone exempts both and publishes green on a
          # head nothing judged. The step says whether a verdict is actually in
          # hand; the outcome only rules out a post that died mid-write.
          MERGE_DELTA_VERDICT_IN_HAND: >-
            ${{ steps.post_review.outcome != 'failure'
            && steps.post_review.outputs.verdict_in_hand == 'true' }}
        # allow-path-shadowed-interpreter: this job installs no venv, so there is no
        # repo interpreter to name, and the gate's import closure is stdlib-only.
        run: python3 .github/scripts/review_findings_gate.py

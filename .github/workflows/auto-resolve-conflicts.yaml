# THIS repository's entry point to the merge-conflict resolver: turn whichever
# event fired into the set of eligible PRs, then hand each one to
# auto-resolve.yaml. The resolution itself — the deterministic pre-pass,
# the per-file model fan-out, the merge commit it pushes back, and the two-job
# privilege split that makes all of it safe — lives in that workflow and is
# documented in its own header. Nothing here holds a write credential.
#
# It mutates the PR branch, so — like the pre-commit autofix — it is NOT a
# required check.
#
# Adopters turn it off with repository VARIABLES rather than by editing this
# file, which template-sync would hand back: AUTO_RESOLVE_DISABLED=true for the
# whole workflow, AUTO_RESOLVE_SCHEDULE_DISABLED=true for the backstop scan
# alone. README's "Configuration" section is the user-facing copy of this list.
#
# WHY FOUR TRIGGERS. A base branch that moves underneath a PR conflicts it while
# emitting no `pull_request` event, and it does not re-fire `labeled` for a PR
# that already carries the merge-conflict label — so the push-to-main scan is the
# only trigger that reaches a conflict introduced from underneath the branch. The
# schedule covers the born-conflicted PR: one cut from an older main conflicts the
# instant it opens, and GitHub suppresses the `opened` event when a GITHUB_TOKEN
# or app actor created it, so nothing else picks that PR up until the next push.
#
# Neither push nor schedule can resolve directly — claude-code-action rejects both
# ("Unsupported event type") — so the `relay` job re-fires this workflow as a
# workflow_dispatch, which it accepts. GITHUB_TOKEN's recursion guard exempts
# workflow_dispatch, so the relay does start a run, and relay fires only on
# push/schedule, so the dispatched run cannot relay again.
name: Auto-resolve merge conflicts

# concurrency-not-required: the expensive jobs are not in this file. The reusable
# workflow keys `resolve` and `land` on `auto-resolve-pr-<n>`, both with
# `cancel-in-progress: false`, so a resolution that has already paid a model
# finishes. A workflow-level group here would cancel the whole call tree on the
# next push and throw that spend away; the jobs this file does own — discover and
# relay — are one `gh` scan each.

on:
  pull_request: # not-required-check — mutates the PR branch; never gate merges on it
    types: [opened, synchronize, reopened, labeled]
  # push-ungated: a push to main is what flips open PRs to CONFLICTING; re-scan
  # them all (the labeler fires on the same event for the same reason).
  push:
    branches: [main]
  # Backstop for born-conflicted PRs no push/label/opened event resolved in time
  # (see the header note). Runs discover across every open PR and relays like the
  # push scan. Every 5 minutes (GitHub's minimum cron granularity) — discover is a
  # cheap, deterministic scan (a few gh API calls, ~30s) that only fans out to the
  # paid resolve when it actually finds a conflicting PR, so a tight cadence just
  # shortens the born-conflicted wait without incurring LLM cost on empty scans.
  #
  # CADENCE IS ADOPTER-TUNABLE: this cron is the knob — a low-PR-volume repo can
  # slow it (e.g. "*/30 * * * *" or hourly). A repo that wants no scheduled
  # backstop at all sets the repository variable AUTO_RESOLVE_SCHEDULE_DISABLED=true
  # (the discover job's `if:` gates the schedule path on it) without editing YAML.
  schedule:
    - cron: "*/5 * * * *"
  # The push/schedule scan's resolve vehicle (see the relay note above); discover
  # re-scans every open PR, so the relay dispatch carries no inputs. `pr` narrows
  # a dispatch to one PR, which is how the resolver's own two self-dispatches
  # address a branch: the partial-resolution carry and the push-race retry.
  # `catch-up` drops both spend filters (the commit-age window and the per-head
  # attempt mark) for that one run — a human uses it over a stranded backlog, and
  # the carry uses it to clear the handoff mark its own last round wrote.
  workflow_dispatch:
    inputs:
      pr:
        description: "Resolve only this PR number; empty scans every open PR"
        type: string
        default: ""
      catch-up:
        description: "Ignore the commit-age window and per-head attempt marks for this run"
        type: boolean
        default: false
      after-race:
        description: "Set by land.sh, not by a human: this run is already the retry for a resolution a push made stale, so it dispatches no further retry"
        type: boolean
        default: false
      debug:
        description: "Post this run's diagnostics as a PR comment"
        type: boolean
        default: false

permissions: {}

# WHERE THE RESOLVER COMES FROM. `discover` clones it below; `resolve` repeats the
# repository in its `with:`, because a `with:` value may not reference `env`.
env:
  RESOLVER_REPOSITORY: AlexanderMattTurner/agent-resolve-merge-conflicts

jobs:
  discover:
    name: Discover PRs to auto-resolve
    # The master switch and the scheduled backstop are both opt-out via a
    # repository variable (cadence knob lives on the cron above), so an adopting
    # repo turns the resolver off without editing this file and having the next
    # template sync hand the edit back. On a `labeled` event, only the
    # merge-conflict label is relevant; every other event enters and the
    # discover script decides eligibility per PR.
    if: >-
      vars.AUTO_RESOLVE_DISABLED != 'true' &&
      (github.event_name != 'schedule' || vars.AUTO_RESOLVE_SCHEDULE_DISABLED != 'true') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'merge-conflict')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read # the per-head attempt mark is a commit status
    outputs:
      prs: ${{ steps.discover.outputs.prs }}
    steps:
      # NO checkout of this repository, and the DEFAULT BRANCH rather than a sha.
      # discover reads GitHub, never the tree, and a pull_request event checks out
      # the MERGE REF by default — the PR-authored copy of the script whose `prs`
      # output drives the write-token resolve job. A shallow clone of the default
      # branch removes that substitution: no pull request author can write it. A
      # second sha literal here would only drift from the `uses:` pin below, which
      # a `with:` value cannot read.
      - name: Check out the resolver from its own repository
        id: resolver
        run: |
          dest="${RUNNER_TEMP}/resolver"
          git clone --no-tags --depth 1 "https://github.com/${RESOLVER_REPOSITORY}.git" "${dest}"
          echo "dir=${dest}/.github/resolver" >>"$GITHUB_OUTPUT"

      - name: Discover conflicting PRs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Present on a pull_request event → the script considers that one PR;
          # empty on push → it scans every open PR.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # A human catch-up dispatch drops both spend filters for this one run;
          # empty values keep the script's own defaults on every other trigger.
          AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS: ${{ inputs.catch-up && '0' || vars.AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS }}
          AUTO_RESOLVE_IGNORE_ATTEMPT_MARK: ${{ inputs.catch-up && 'true' || 'false' }}
          # Unset repository variables arrive empty, and every script defaults an
          # empty value — so an adopter tunes these without editing this file.
          AUTO_RESOLVE_ATTEMPT_TTL_HOURS: ${{ vars.AUTO_RESOLVE_ATTEMPT_TTL_HOURS }}
          AUTO_RESOLVE_ATTEMPT_FLOOR_MINUTES: ${{ vars.AUTO_RESOLVE_ATTEMPT_FLOOR_MINUTES }}
          # Passed only so discover REFUSES a repository still setting the retired
          # name. Dropping it here instead would ignore that variable in silence,
          # narrowing the operator's bound to the 20-minute default without saying so.
          AUTO_RESOLVE_ATTEMPT_FLOOR_HOURS: ${{ vars.AUTO_RESOLVE_ATTEMPT_FLOOR_HOURS }}
          # AUTO_RESOLVE_RESOLVER_REPO/REF are deliberately unset: they tell the
          # handoff-mark probe which OTHER repository holds the resolver, and this
          # repository is that resolver. The probe ignores a repo equal to the
          # caller's, so passing them here would say nothing.
          # Read as a name rather than expanded into the `run:` body below. A
          # step's own `env:` outranks the job environment, so a write to
          # $GITHUB_ENV cannot repoint which tree this step executes.
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        # No bootstrap guard: the script comes from the resolver clone above, so an
        # absent one fails loud instead of quietly reporting an empty set.
        run: python3 "${RESOLVER_DIR}/auto-resolve/discover.py"

  relay:
    name: Relay push/schedule scan as workflow_dispatch
    needs: discover
    # Both the push and the scheduled scan run under an event claude-code-action
    # rejects, so both resolve indirectly by re-dispatching. Keep this off
    # workflow_dispatch itself so the relayed run can't relay again (no loop).
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-dispatch this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-resolve-conflicts.yaml --ref "${GITHUB_REF_NAME}"

  resolve:
    name: Auto-resolve merge conflicts
    needs: discover
    # push and schedule run relay instead of resolving (claude-code-action rejects
    # both); resolve happens on the relayed workflow_dispatch (and directly on a
    # pull_request event).
    if: >-
      github.event_name != 'push' && github.event_name != 'schedule' &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      # Serialize the fan-out: each PR gets its own push, and the shared LLM/token
      # budget makes parallel resolves more contention than speed is worth.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    # THE CEILING, NOT THE GRANT. A called workflow may request only what the
    # calling job already holds, so this block is the union of what `resolve` and
    # `land` declare over there; each of those jobs still narrows it to its own
    # set, and the privilege split below is unaffected. Grant less and the whole
    # run ends in `startup_failure` before any job starts — not a red job.
    # Copy this block with the `with:`/`secrets:` blocks below.
    permissions:
      # BEGIN GENERATED: caller permissions ceiling for auto-resolve.yaml (.github/scripts/gen_caller_permissions.py) — do not edit by hand
      actions: write # auto-resolve.yaml: land
      contents: write # auto-resolve.yaml: land
      issues: write # auto-resolve.yaml: resolve, land
      pull-requests: write # auto-resolve.yaml: resolve, land, report, debug-report
      statuses: write # auto-resolve.yaml: resolve, land
      # END GENERATED: caller permissions ceiling for auto-resolve.yaml
    # The resolver itself, its two-job privilege split, its permissions and its
    # concurrency all live in the reusable workflow — this file only says WHICH
    # pull requests to hand it and what this repository can do.
    #
    # PINNED BY SHA even though the resolver lives in this repository, and that is
    # the security-relevant part. This file also fires on `pull_request`, and a
    # local `./` reference resolves against the PR's own merge ref — so a
    # same-repo pull request that edited auto-resolve.yaml would run ITS version
    # of the resolve job, with every secret below. Cloning the resolver protects
    # the SCRIPTS; only a pinned `uses:` protects the workflow that holds the
    # credentials. The `uses:` line is the only place the sha appears: the called
    # workflow reads it back from `job.workflow_sha`, so its scripts come
    # from this same commit. Each release advances this pin along with the tags.
    # ADVANCE THIS PIN BEFORE PASSING A NEWLY DECLARED INPUT BELOW. A `with:` key
    # the PINNED copy does not declare ends the whole run in `startup_failure`,
    # so no job runs and no check reports. An input therefore lands in
    # auto-resolve.yaml first, and the pin plus the `with:` line follow in a
    # later change. tests/test_auto_resolve_caller_pin.py holds the two together.
    uses: AlexanderMattTurner/agent-resolve-merge-conflicts/.github/workflows/auto-resolve.yaml@1e75d662a196dce1e00c67bcd8a691fb55b53e98 # v1.11.0
    with:
      pr: ${{ matrix.pr.number }}
      # The literals from this file's `env:` block, repeated because a reusable
      # workflow's `with:` cannot read `env`. Change both together.
      resolver-repository: AlexanderMattTurner/agent-resolve-merge-conflicts
      # This repository declares its own derived files, so both pre-passes run:
      # the marked regions under scripts/lib_marked_region.py, and the rules in
      # config/auto-resolve-regen-rules.json. Without these three inputs a
      # lockfile conflict reaches the model, which has no correct resolution for
      # one — and `uv.lock` and `pnpm-lock.yaml` are `-merge` in .gitattributes,
      # so it would fail the run instead.
      marked-regions: true
      resolver-mjs: .github/scripts/resolve-generated.mjs
      pre-pass-command: node .github/scripts/resolve-generated.mjs
      #
      # `log-redactor` is unset, which publishes NO fan-out logs. That is
      # the fail-closed default: an agent transcript carries whatever the merge
      # exposed it to, so a repository with no redactor uploads nothing.
      #
      # A repository VARIABLE with this file's own default behind it. An adopter
      # widens the flagged set without editing a synced file, which template-sync
      # would hand straight back on the next run.
      protected-paths-regex: ${{ vars.AUTO_RESOLVE_PROTECTED_RE || '^(\.github/|\.claude/|\.hooks/)' }}
      # A run that dies before the resolver is cloned publishes nothing at all,
      # so the repository variable is the only way to turn diagnostics on without
      # a dispatch — an adopter debugging a silent resolver sets it and waits for
      # the next scan. `inputs.debug` is null on every trigger but the dispatch.
      debug: ${{ inputs.debug || vars.AUTO_RESOLVE_DEBUG == 'true' }}
      # Both reach the RESOLVE job, not only discover. The claim check re-reads
      # the per-head attempt mark, so a catch-up that stops at discover stands
      # down there; and AFTER_RACE is what stops a race retry from dispatching
      # its own retry, one paid model run per push.
      catch-up: ${{ inputs.catch-up || false }}
      after-race: ${{ inputs.after-race || false }}
    # Named rather than `secrets: inherit`, so this call passes only what the
    # resolver declares and a consumer repository can copy the block verbatim.
    # An unset secret arrives empty, which drops that ladder rung.
    secrets:
      FAR_ANTHROPIC_API_KEY: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTOFIX_TOKEN_ORG: ${{ secrets.AUTOFIX_TOKEN_ORG }}
      TEMPLATE_SYNC_TOKEN_ORG: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG }}

name: PR meta (privileged)

# The two PR-bot jobs that need a WRITE-scoped token even from fork PRs:
#   * cancel — cancel a closed PR's orphaned in-flight runs (actions: write).
#   * label  — label open PRs that have merge conflicts (pull-requests/issues: write).
# Both run on pull_request_target so the token is write-capable from forks, and
# both run NO PR-authored code: each sparse-checks-out only the trusted BASE
# repo's .github/scripts at the base ref with persist-credentials:false, so the
# elevated token never touches fork content.
#
# A third job, evict, drops the merge-queue entries label named. It holds
# `contents: write`, which is why it is a separate job barred from
# pull_request_target: its own header states that.
#
# These are kept in a SEPARATE file from the pr-meta gates on purpose: co-locating
# a pull_request_target trigger with those gates would trip CodeQL's
# untrusted-checkout-in-privileged-context query, which is file-scoped and cannot
# see the per-job event gating.
#
# Concurrency is declared PER JOB (never workflow-level): each former workflow had
# its own group with its own cancel-in-progress, and a shared static group would
# make the jobs cancel each other.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — base-only sparse checkouts, no PR code run; see cancel/label job headers
    types: [opened, synchronize, reopened, edited, closed]
  # Every 5 minutes (GitHub's minimum cron granularity), matching the auto-resolver's
  # own backstop: this scan is what names the merge-queue entries `evict` drops, and
  # a conflicted entry holds a queue slot the queue can never spend until something
  # drops it. The push trigger below covers what creates almost all of them; this
  # caps the rest — a retarget, a scan a superseding push cancelled, a queue that
  # conflicted a PR between scans. The scan is API-only, reads one page of open PRs
  # and mutates nothing on a clean repository, so a tight cadence buys latency at
  # runner cost alone. Slow it (`*/30`, hourly) on a repository with no merge queue.
  schedule:
    - cron: "*/5 * * * *"
  # push-ungated: a push to a branch is the event that creates conflicts - the open PRs based on that branch need re-checking (merge-conflict labeler). EVERY branch, because a pull request's base can be any branch; `"**"` excludes tags, and the exclusion drops the merge queue's own ephemeral branches, which no pull request targets.
  push:
    branches: ["**", "!gh-readonly-queue/**"]
  workflow_dispatch:

permissions: {}

jobs:
  # ── cancel ────────────────────────────────────────────────────────────────
  # SECURITY — pull_request_target is safe here because this job runs NO PR-authored
  # code. The only checkout is a sparse checkout of the BASE repo's own
  # .github/scripts at the trusted base ref (pull_request_target checks out the base,
  # never the PR head — persist-credentials: false), so the fork's head tree is never
  # fetched or executed. The script then calls `gh` against the Actions API with the
  # base token, using GitHub-provided (unspoofable) head ref/SHA passed through the
  # environment — never interpolated into a shell command. A fork PR therefore cannot
  # influence anything beyond which of its OWN runs get cancelled.
  cancel:
    name: Cancel orphaned runs for the closed PR
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    concurrency:
      # Per-PR: a second close event (rare) queues behind the first rather than
      # racing it. Static-but-per-PR key, and this is never a required check.
      group: cancel-superseded-pr-runs-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Sparse-checkout the base repo's own scripts (the trusted base ref for
      # pull_request_target, never the PR head), plus the resolver holding the
      # lib-ci-retry.sh that cancel-pr-runs.sh sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/resolver
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cancel the head SHA's in-flight runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/cancel-pr-runs.sh

  # ── label ─────────────────────────────────────────────────────────────────
  # pull_request_target (not pull_request) so the label write has a write-scoped
  # token even from forks; it checks out only base-repo `.github/scripts` with no
  # persisted credentials and runs no PR-authored code, so the elevated token
  # touches nothing the PR controls. Fires on schedule (6-hourly backstop for
  # lazily-computed UNKNOWN mergeability), push to any branch (a base moved →
  # every open PR can flip), pull_request_target open/sync/reopen/edited (one PR
  # moved — a RETARGET is an `edited` event, and nothing else re-syncs a PR whose
  # base branch changed), and workflow_dispatch. NOT a required status check: purely advisory labeling.
  label:
    name: Label open PRs that have merge conflicts
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
        (github.event.action == 'edited' && github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write # PR labels ride the issues API
    outputs:
      evict-queue: ${{ steps.sync.outputs.evict-queue }}
    concurrency:
      # Per-PR for PR events (pull_request_target's github.ref is the base ref
      # refs/heads/main, so keying on it alone would drop every scoped PR sync into
      # the same group as the push/schedule full scans and cancel them). push and
      # schedule carry no pull_request payload → fall back to github.ref, so
      # redundant full scans of the same base still supersede each other.
      group: merge-conflict-labeler-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # Plus the resolver directory, which holds the lib-ci-retry.sh the
      # labeler sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/resolver
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sync merge-conflict labels
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Present only on a PR event → the script syncs that one PR; empty on
          # push/schedule/dispatch → it scans every open PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Turns the staleness check on, and every FULL SCAN sets it: a queued
          # scan starts long after the event that made it, by which time GitHub
          # may answer with a verdict it computed against the old base. Only a PR
          # event leaves it empty — cancel-in-progress supersedes a run there.
          BASE_SHA: ${{ github.event_name != 'pull_request_target' && github.sha || '' }}
          # Reactive events poll harder to wait out GitHub's lazy UNKNOWN,
          # because querying is what starts that computation: a single PR is
          # cheap to re-query, and a base push invalidates many PRs at once.
          # A scan that gives up early leaves a conflicted queue entry standing
          # until the next one, so every FULL scan takes the same budget — the
          # cron is no longer a cheap backstop, it is the safety net under the
          # eviction path. A DISPATCH is a base-push sweep under another name
          # (release-tags.yaml fires one after a release, whose `[skip ci]` push
          # starts no run of its own), so it takes the same budget.
          MAX_PASSES: ${{ github.event_name == 'pull_request_target' && '6' || '4' }}
        run: bash .github/resolver/label-merge-conflicts.sh

  # ── evict ─────────────────────────────────────────────────────────────────
  # SECURITY — this is `label`'s eviction arm, split out for its permissions
  # alone. `dequeuePullRequest` is a merge-queue write and needs `contents:
  # write`; `label` also runs on pull_request_target, where that scope would hand
  # a fork event a token that can push to the default branch. The `if` below is
  # what keeps this job off that event, and `label` names entries only on a full
  # scan, so the two agree. Like `label`, it runs no PR-authored code: the only
  # checkout is a sparse checkout of the BASE repo's own .github/resolver.
  evict:
    name: Evict the merge-queue entries conflicted PRs hold
    needs: label
    if: github.event_name != 'pull_request_target' && needs.label.outputs.evict-queue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # dequeuePullRequest is a merge-queue write
      pull-requests: write
      issues: write # the stuck-entry notice rides the issues API
    concurrency:
      # Keyed like `label`'s full-scan arm, so redundant scans of the same base
      # supersede each other here too. Never cancel-in-progress: a cancelled
      # dequeue leaves the entry holding its slot with nothing said.
      group: merge-queue-evict-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/resolver
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Drop the entries the queue can never build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVICT_PRS: ${{ needs.label.outputs.evict-queue }}
        run: bash .github/resolver/evict-queue-entries.sh

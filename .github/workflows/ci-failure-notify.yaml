name: CI failure notify

# Post-merge (push-to-main) and scheduled workflow failures emit no PR webhook,
# so they rot unnoticed — releases have silently stopped for weeks downstream.
# This workflow pushes a phone notification through ntfy for such a failure. It
# files no issue: the tracker filled with bot-authored duplicates that nobody
# closed, which buried the human issues.
#
# The notification is a no-op unless the GH_NTFY_SUBJECT secret is set: a repo
# that has not opted in gets no unattended-failure alert at all, and this run
# still reports green. Set GH_NTFY_URL to target a self-hosted ntfy server
# (defaults to https://ntfy.sh).
#
# `workflow_run` has no wildcard, so `workflows:` below must name every
# workflow in this repo with a `push:` or `schedule:` trigger (matched by the
# workflow's `name:`). .github/scripts/gen_failure_notify_listener.py derives
# that list from the tree and owns the marked region below; a ci-truth-serum
# hook (check-failure-notifier-coverage) holds the committed region to the same
# predicate. Binding is by NAME, not filename: a repo that keeps its own release
# workflow instead of the template's auto-version.yaml must give it the name
# listed here or add its own.
# The dangerous-triggers finding targets workflows that check out or execute
# the triggering ref's code with write credentials; this one checks out only
# the default branch (credential-less) and gates on default-branch runs.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run: # unfiltered-listener-ok: this acts on the DEFAULT branch, whose name `branches:` cannot express — it takes no expression, and this workflow ships to repos whose default is not `main`. The job's `if:` reads it from `github.event.repository.default_branch`.
    types: [completed]
    # BEGIN GENERATED: watched workflow names (.github/scripts/gen_failure_notify_listener.py) — do not edit by hand
    workflows:
      - Auto version bump and publish
      - Auto-resolve merge conflicts
      - CI failure-rate report
      - Format check
      - Gitleaks Secret Scanning
      - Hook lifecycle
      - Lint
      - Node tests
      - PR meta (privileged)
      - pre-commit
      - Release canary
      - Release tags
      - Sync from Template
      - Sync required status checks
      - TLA+ model check
      - Validate config
      - Weekly Security & Dependency Remediation
      - zizmor
    # END GENERATED: watched workflow names

concurrency:
  # Keyed per triggering workflow so failures of different workflows never
  # queue behind each other; never cancel — a dropped notification defeats
  # the whole point.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify on unattended CI failure
    # PR-triggered failures are already visible on the PR; only failures of
    # push/schedule runs on the default branch go unnoticed. Skipped/cancelled
    # conclusions are not failures; action_required, startup_failure and
    # timed_out are red runs GitHub reports outside 'failure', so they count too.
    if: >-
      contains(fromJSON('["action_required", "failure", "startup_failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run workflows always execute from the default branch, so this
      # fetches exactly the vetted action; sparse + credential-less keeps it
      # to the notifier and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/notify-ntfy
          persist-credentials: false

      - name: Notify ntfy
        uses: ./.github/actions/notify-ntfy
        with:
          topic: ${{ secrets.GH_NTFY_SUBJECT }}
          base-url: ${{ secrets.GH_NTFY_URL }}
          title: "${{ github.repository }}: ${{ github.event.workflow_run.name }} failed"
          message: >-
            ${{ github.event.workflow_run.name }}
            ${{ github.event.workflow_run.conclusion }} on
            ${{ github.event.workflow_run.head_branch }}
            (${{ github.event.workflow_run.event }}, run #${{ github.event.workflow_run.run_number }}).
          click: ${{ github.event.workflow_run.html_url }}

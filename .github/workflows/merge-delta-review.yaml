# Read the merge-resolution deltas a pull request carries, and post a verdict.
#
# THE COMPANION TO auto-resolve.yaml, AND A SEPARATE WORKFLOW ON PURPOSE. That
# one runs from a `workflow_dispatch` for a pull request someone handed it, so
# its pre-push self-review only ever reads merges the resolver itself made. This
# one runs from the caller's `pull_request_target`, so it also reads a merge a
# PERSON resolved by hand — which the resolver never sees. Measured on one
# adopter: 154 of 415 in-branch merges were hand-authored.
#
# The two also hold different privileges, which no single file can express. That
# one checks out the UNTRUSTED pull request head and mutates the branch. This one
# never checks out the head: it reads the head's merge commits as git OBJECTS,
# renders them, sanitizes the render, and hands the model data.
#
# WHAT THIS WORKFLOW DOES NOT DO: post the required status that blocks a merge.
# The verdict is an output, and the caller decides what gates on it. A gate is a
# repository's own policy, and the script this repository gates with reads its own
# severity config and label names, so shipping it would ship this repository's
# policy to every consumer.
name: Review merge-resolution deltas (reusable)

on:
  workflow_call:
    inputs:
      pr:
        description: "The pull request whose merge-resolution deltas need a verdict. Required: this workflow reviews one pull request per call."
        required: true
        type: string
      resolver-repository:
        description: "The repository holding the renderer and the review prompt. A FORK that ships this workflow must name ITSELF here: `resolver-ref` defaults to this workflow's own commit, which the default repository does not carry. The step that calls the model is a composite action, so it is pinned to the default repository by a literal string and does NOT follow this input."
        required: false
        default: "AlexanderMattTurner/agent-resolve-merge-conflicts"
        type: string
      resolver-ref:
        description: "LEAVE IT EMPTY. The workflow reads the commit your `uses:` line names back out of `job.workflow_sha`, so the pin is written once. Name a ref here only to run the renderer from a commit other than the one this workflow came from."
        required: false
        default: ""
        type: string
      resolver-mjs:
        description: "Repo-relative path in YOUR repository to the script that says which files a required check re-derives — the same value you pass auto-resolve.yaml. The renderer stops reading those paths, so a regenerated lockfile is not reviewed as if a hand wrote it. Empty reviews every delta, which costs a reader work rather than trust."
        required: false
        default: ""
        type: string
      derived-attributes:
        description: "Space-separated gitattributes YOUR repository sets on a file whose one correct content is what the MERGED tree fixes — a ratchet baseline, a ledger keyed on a count. The renderer keeps every hunk of such a file and asks the reader for a whole-file check instead. `-merge` is read on its own and needs no entry. Empty declares none."
        required: false
        default: ""
        type: string
      model:
        description: "The model that reads the deltas. This read is the last word on a merge for most callers, so it defaults to the strongest one rather than the cheapest."
        required: false
        default: "claude-opus-5"
        type: string
      timeout-minutes:
        description: "How long the review may take before the runner kills it. A timeout fails OPEN for the caller's gate, so raise it rather than let a large delta die unread."
        required: false
        default: 15
        type: number
    secrets:
      FAR_ANTHROPIC_API_KEY:
        description: "A metered Anthropic API key, spent BEFORE every rung below. A subscription rung this read exhausts is gone for every other run the account has; a metered key bills this read and leaves them alone. Unset skips it."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "The LAST credential rung. It is the account an operator already has, so every token provisioned for CI is spent first."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK:
        description: "First rung. An unset rung is skipped, so a setup that configures only CLAUDE_CODE_OAUTH_TOKEN reaches it with no wasted attempt."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2:
        description: "Second rung; empty skips it."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3:
        description: "Third rung; empty skips it."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4:
        description: "Fourth rung; empty skips it."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5:
        description: "Fifth rung; empty skips it."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6:
        description: "Sixth rung; empty skips it."
        required: false
    outputs:
      verdict-in-hand:
        description: "`true` when a verdict for this head reached the pull request. Feed it to whatever your repository gates on: a head with no verdict is a head nothing read, and treating that as a pass publishes green over an unreviewed merge."
        value: ${{ jobs.review.outputs.verdict-in-hand }}
      has-deltas:
        description: "`false` when the head carries no merge commit to read, which is the ordinary case for a pull request that never conflicted. The review is skipped and the verdict is still posted, so a sticky comment about a since-removed merge refreshes to the clean verdict."
        value: ${{ jobs.review.outputs.has-deltas }}
      review-clean:
        description: "`true` only when a verdict reached the pull request AND it raised no concern. `verdict-in-hand` says a read happened, not what it found, so gate on THIS to reject a flagged merge. An unreviewed head answers `false`, so a gate keyed on it fails closed."
        value: ${{ jobs.review.outputs.review-clean }}
      head-sha:
        description: "The head this verdict describes, read from `refs/pull/N/head` inside the job. A caller that posts its own status names THIS sha: the sha in the trigger payload froze at dispatch, and this job can finish half an hour later."
        value: ${{ jobs.review.outputs.head-sha }}
      review-artifact:
        description: "Name of the artifact this run staged, or empty when the render itself failed. It always holds `merge-delta.shas.txt`, the merges the renderer covered, copied out before the model ran. It holds `merge-review.md` only when the reviewer wrote one — read `review-in-artifact` rather than the file's presence."
        value: ${{ jobs.review.outputs.review-artifact }}
      review-in-artifact:
        description: "`true` when the artifact carries the reviewer's own words, already run through the same sanitizer the posted comment uses. `false` for a head with no deltas and for a reviewer that died, so a caller quoting the review never mistakes an absent file for an all-clear."
        value: ${{ jobs.review.outputs.review-in-artifact }}

permissions: {}

jobs:
  review:
    # BYTE-IDENTICAL to what a caller's gate matches on. GitHub names a called
    # job's check run `<caller job> / <this name>`, so a caller that gates on the
    # verdict matches the suffix, never the whole string.
    name: Review the PR's merge-resolution deltas
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One review per pull request at a time. The verdict is a read-modify-write
    # of a single sticky comment, so two overlapping runs let an older head's
    # verdict patch over a newer head's and leave a clean verdict standing.
    concurrency:
      group: merge-delta-review-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the caller's trusted base commit
      pull-requests: write # post the advisory verdict comment
    outputs:
      verdict-in-hand: ${{ steps.post_review.outputs.verdict_in_hand }}
      has-deltas: ${{ steps.prepare.outputs.has_deltas }}
      review-clean: ${{ steps.post_review.outputs.review_clean }}
      head-sha: ${{ steps.prepare.outputs.head_sha }}
      review-artifact: ${{ steps.review_artifact.outputs.name }}
      review-in-artifact: ${{ steps.stage_review.outputs.has_review }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      # Per pull request, so two calls in one run never collide on the name.
      REVIEW_ARTIFACT: merge-delta-review-${{ inputs.pr }}
    steps:
      - name: Check out the calling repository's trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The DEFAULT branch, never the untrusted head and never the
          # author-writable base.ref: this tree supplies the renderer's cwd and
          # the rule table. The RANGE comes from the base branch prepare fetches
          # as objects, so a pull request onto a release branch or onto another
          # feature branch is reviewed over its own commits alone. fetch-depth: 0
          # so that range resolves against a complete history.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the renderer from its own repository
        # A local `uses: ./…` in a REUSABLE workflow resolves against the
        # CALLER's workspace, which holds none of this. So the renderer, its
        # libraries and the review prompt arrive by clone from a repository the
        # calling pull request cannot write.
        id: resolver
        env:
          RESOLVER_REPO: ${{ inputs.resolver-repository }}
          RESOLVER_REF: ${{ inputs.resolver-ref || job.workflow_sha }}
          # The raw input, so the refusal below tells a caller's own bad ref
          # apart from the fork case, where the ref is this workflow's commit.
          RESOLVER_REF_INPUT: ${{ inputs.resolver-ref }}
        run: |
          # allow-long-run: this step is what FETCHES this repository's scripts, and
          # it runs in the caller's checkout, which holds none of them. A script here
          # could only be called from the clone this step has not made yet.
          dest="${RUNNER_TEMP}/resolver"
          # Empty means neither the caller nor GitHub named a commit, and a clone
          # would then run the default branch — which is what pinning `uses:` is
          # for. Refuse rather than run unpinned code with the caller's secrets.
          : "${RESOLVER_REF:?resolver-ref is empty and job.workflow_sha is unset}"
          timeout --kill-after=30 300 git clone --no-tags \
            "https://github.com/${RESOLVER_REPO}.git" "${dest}"
          # `clone --no-tags` brings no tag and only the default branch's own local
          # ref, so a TAG or another branch reaches this tree only through the
          # destination refspec below. A SHA needs no fetch, and a server may
          # refuse one, so a failed fetch here is not yet an error.
          timeout --kill-after=30 300 git -C "${dest}" fetch --depth=1 origin \
            "+${RESOLVER_REF}:refs/resolver/pin" || true
          # ONE resolution, which the checkout below takes: the fetched ref first,
          # then the name itself, which is how a SHA the clone already carries
          # resolves. So nothing unresolvable reaches `checkout`.
          sha="$(git -C "${dest}" rev-parse --verify --quiet "refs/resolver/pin^{commit}" \
            || git -C "${dest}" rev-parse --verify --quiet "${RESOLVER_REF}^{commit}" || true)"
          if [[ -z "${sha}" ]]; then
            # Two causes, and only the second is a fork: an EMPTY `resolver-ref`
            # means the ref is this workflow's own commit, which upstream lacks.
            if [[ -n "${RESOLVER_REF_INPUT}" ]]; then
              echo "::error::${RESOLVER_REPO} has no ref or commit ${RESOLVER_REF}, which the resolver-ref input named." >&2
            else
              echo "::error::${RESOLVER_REPO} has no commit ${RESOLVER_REF}. That is this workflow's own commit, so a fork shipping this workflow must pass resolver-repository naming that fork." >&2
            fi
            exit 1
          fi
          git -C "${dest}" checkout --detach "${sha}"
          # The renderer reaches outside its own directory: the installers, the
          # version pins they read, and the prompt the model follows.
          {
            echo "dir=${dest}/.github/resolver"
            echo "scripts=${dest}/.github/scripts"
            echo "prompts=${dest}/.github/prompts"
          } >>"$GITHUB_OUTPUT"

      - name: Install the input sanitizer
        # From the CLONE, so a consumer needs no sanitizer entry in its own
        # package.json and no node_modules of its own.
        env:
          RESOLVER_SCRIPTS: ${{ steps.resolver.outputs.scripts }}
        run: bash "${RESOLVER_SCRIPTS}/install-input-sanitizer.sh"

      - name: Render and sanitize the merge-resolution deltas
        id: prepare
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          RESOLVER_SCRIPTS: ${{ steps.resolver.outputs.scripts }}
          # ABSOLUTE inside the trusted base checkout, which is what the
          # renderer's contract requires: the table says which deltas it stops
          # reading, so a relative path would resolve against the renderer's cwd
          # and let the pull request declare its own deltas generated.
          AUTO_RESOLVE_RESOLVER_MJS: ${{ inputs.resolver-mjs && format('{0}/{1}', github.workspace, inputs.resolver-mjs) || '' }}
          AUTO_RESOLVE_DERIVED_ATTRS: ${{ inputs.derived-attributes }}
        # BASE_REF deliberately unset, so the script asks the pull request for
        # the branch it merges into. The trigger payload's base froze at
        # dispatch, and a retarget while this run queues would scope a LIVE head
        # against a base the pull request no longer has — which drops the former
        # parent's merges out of the range and clears them unread.
        run: bash "${RESOLVER_SCRIPTS}/prepare-merge-delta-input.sh"

      - name: Copy the renderer's sha list out of the model's reach
        # Staged BEFORE inference. The list says which merges an answer covered,
        # and a caller keys durable state on it, so a model that edited it could
        # retire a merge nobody read. The grant below reaches one file, and this
        # copy is what makes that grant's failure survivable.
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          STAGE_DIR: ${{ runner.temp }}/review-out
        run: |
          mkdir -p "${STAGE_DIR}"
          cp "${PR_INPUT_DIR}/merge-delta.shas.txt" "${STAGE_DIR}/merge-delta.shas.txt"

      - name: Review the merge deltas with Claude
        id: review
        if: steps.prepare.outputs.has_deltas == 'true'
        # Pinned to this repository by SHA rather than `./`: see the clone step.
        uses: AlexanderMattTurner/agent-resolve-merge-conflicts/.github/actions/claude-run@26547867526c1fd3ca0289a700b1a964cffa4f45 # v1.34.2
        with:
          api_key: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Give the action the workflow token directly. Without it the action
          # tries to mint one through an OIDC exchange the caller has not
          # authorized, and fails before Claude runs.
          github_token: ${{ github.token }}
          # Review outside-contributor pull requests too; safe for the same
          # reasons the checkout above is: base-only tree, least-privilege
          # token, sanitized data-only input.
          allowed_non_write_users: "*"
          model: ${{ inputs.model }}
          # Each tool rule carries a path: a bare tool name is a whole-tool grant
          # that overrides the per-path check. The prompt directory is READ-only;
          # only the input directory is writable, and only for the review file.
          #
          # pr-input needs its OWN Read rule. `--add-dir` widens the working set,
          # but with an explicit --allowedTools list a path still needs a matching
          # Read(...) grant, and merge-delta.txt lives there — untrusted_input only
          # NAMES that file, so the model has to read it itself or review nothing.
          #
          # Every absolute path takes TWO leading slashes, so each one below is
          # written `/${{ … }}` and the expansion supplies the second. One slash
          # anchors the pattern at the CLI's own cwd, which no runner path is
          # under, so the rule parses and then matches nothing.
          claude_args: >-
            --setting-sources user
            --allowedTools "Read(./**),Read(/${{ steps.resolver.outputs.prompts }}/**),Read(/${{ runner.temp }}/pr-input/**),Edit(/${{ runner.temp }}/pr-input/merge-review.md)"
            --add-dir "${{ runner.temp }}/pr-input"
            --add-dir "${{ steps.resolver.outputs.prompts }}"
          prompt: |
            You are the merge-delta reviewer for PR #${{ inputs.pr }} in ${{ github.repository }}.
            Follow the instructions in ${{ steps.resolver.outputs.prompts }}/claude-merge-delta-review.md — it is
            the single source of truth for how to review and the exact merge-review.md format.

            Write your review to ${{ runner.temp }}/pr-input/merge-review.md — nothing else.
            Do not post comments, resolve threads, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_input: |
            merge deltas: ${{ runner.temp }}/pr-input/merge-delta.txt

      - name: Sanitize the review before any caller reads it
        # The model's text is derived from the untrusted merge delta, so it is
        # run through the SAME sanitizer the posted comment uses. Exporting the
        # raw file would hand a caller that quotes it in a review thread the one
        # payload the comment path already neutralizes.
        #
        # always(), for the same reason the post step below carries it: the one
        # state a caller most needs to see is deltas present with the reviewer
        # dead, and an implicit success() skips exactly that.
        id: stage_review
        if: always() && steps.prepare.conclusion == 'success'
        env:
          REVIEW: ${{ runner.temp }}/pr-input/merge-review.md
          STAGE_DIR: ${{ runner.temp }}/review-out
          RESOLVER_SCRIPTS: ${{ steps.resolver.outputs.scripts }}
        run: |
          if [[ -s "${REVIEW}" ]]; then
            node "${RESOLVER_SCRIPTS}/sanitize-pr-input.mjs" \
              <"${REVIEW}" >"${STAGE_DIR}/merge-review.md"
            printf 'has_review=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_review=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Hand the caller what this run staged
        # For a caller whose gate needs the review TEXT — to open a thread that
        # quotes the finding — and the merges an answer covered. The verdict
        # outputs say clean or not; they cannot say what was found.
        id: upload_review
        if: always() && steps.stage_review.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REVIEW_ARTIFACT }}
          path: ${{ runner.temp }}/review-out
          if-no-files-found: error
          retention-days: 1

      - name: Name that artifact for the caller
        # A step, because `env` is out of scope in a job's `outputs:` block and
        # the name would otherwise be spelled a second time there.
        id: review_artifact
        if: always() && steps.upload_review.outputs.artifact-id
        run: printf 'name=%s\n' "${REVIEW_ARTIFACT}" >>"$GITHUB_OUTPUT"

      - name: Post the advisory merge-delta review
        # Runs whenever prepare SUCCEEDED — including has_deltas=false — so a
        # sticky comment about a since-removed merge refreshes to the clean
        # verdict rather than standing stale. Skipped when prepare failed loud,
        # where the red job IS the signal.
        #
        # always(), because an implicit success() skips this step whenever an
        # EARLIER one reddened the job — and the reviewer step is earlier, so the
        # one state this step exists to report (deltas present, reviewer died) is
        # exactly the state that would skip it.
        id: post_review
        if: always() && steps.prepare.conclusion == 'success'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          RESOLVER_SCRIPTS: ${{ steps.resolver.outputs.scripts }}
          # From the RENDERER, not from whether the reviewer wrote a file. This
          # step runs even when the review step went red, so an inferred value
          # would publish "no deltas" for a head whose reviewer died.
          HAD_DELTAS: ${{ steps.prepare.outputs.has_deltas }}
          # The deltas reach the model through ONE Read of merge-delta.txt, so a
          # denied Read means the verdict below it covers nothing. Empty is the
          # honest unknown — the reviewer was skipped or died before the gate ran
          # — and the branches above already fail closed on both of those.
          DENIED_TOOLS: ${{ steps.review.outputs.permission_denied_tools }}
        run: bash "${RESOLVER_SCRIPTS}/post-merge-delta-review.sh"

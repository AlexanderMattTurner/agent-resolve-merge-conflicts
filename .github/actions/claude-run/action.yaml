name: "Run Claude with OAuth failover"
description: >-
  Single source of truth for invoking anthropics/claude-code-action across this
  template's workflows: it pins the action once and walks an ordered credential
  ladder — an optional metered API key, then up to seven subscription tiers. A
  metered key is spent first, because a subscription tier this run exhausts is
  gone for every other run the account has. The caller decides which secret fills which tier;
  the shipped workflows put CLAUDE_CODE_OAUTH_TOKEN LAST, so CI spends the tokens
  provisioned for it before the operator's own account. claude-code-action exits 0
  even on a failed run, so a rung's verdict is read from its execution log
  (claude-run-errored.sh), never from the step outcome: a rung is attempted when
  NO earlier rung has produced a non-errored run and that rung's own token is
  non-empty — the FIRST tier included, so a setup that fills only the last rung
  pays nothing for the tiers it left unset. Each retry waits out a short
  escalating backoff first, so one provider-side blip cannot consume every
  credential at once. Rung 2 doubles as the free repeat: with its own token unset
  it re-spends rung 1's credential, and only when rung 1's failure billed nothing
  (zero_cost), which costs nothing to repeat. The rungs, their waits and that
  repeat are RENDERED from .github/resolver/lib_credential_ladder.py by
  .github/scripts/gen_credential_ladder.py, which the resolve job's own ladder
  reads too — add a rung to lib/shared-names.json and regenerate, never by hand.
  Callers pass their own prompt / model / claude_args / tool gating; the
  credential and retry logic live only here so no workflow re-implements them.
inputs:
  # BEGIN GENERATED: credential ladder inputs (.github/scripts/gen_credential_ladder.py) — do not edit by hand
  api_key:
    description: "Metered credential, spent FIRST. A subscription rung a run exhausts is gone for every other run the account has, so a metered slot bills this work and leaves them alone."
    required: false
    default: ""
  oauth_token:
    description: "Subscription credential for rung 2. Empty does NOT skip this rung: it falls back to rung 1's credential, and only on a proven zero-cost failure, which costs nothing to repeat."
    required: false
    default: ""
  fallback_oauth_token:
    description: "Subscription credential for rung 3; empty skips the rung."
    required: false
    default: ""
  fallback_oauth_token_2:
    description: "Subscription credential for rung 4; empty skips the rung."
    required: false
    default: ""
  fallback_oauth_token_3:
    description: "Subscription credential for rung 5; empty skips the rung."
    required: false
    default: ""
  fallback_oauth_token_4:
    description: "Subscription credential for rung 6; empty skips the rung."
    required: false
    default: ""
  fallback_oauth_token_5:
    description: "Subscription credential for rung 7; empty skips the rung."
    required: false
    default: ""
  fallback_oauth_token_6:
    description: "Subscription credential for rung 8; empty skips the rung."
    required: false
    default: ""
  # END GENERATED: credential ladder inputs
  github_token:
    description: >-
      Token handed to the action directly so it skips the OIDC->GitHub-App
      exchange. Empty lets the action resolve its own default.
    required: false
    default: ""
  model:
    description: >-
      Model slug (e.g. claude-sonnet-5). Rendered into the action's --model flag
      here, ahead of claude_args, so every attempt pins the tier explicitly and
      the action never rides its own default; keep the slug OUT of claude_args.
    required: true
  prompt:
    description: "Prompt for the agent. Empty runs the action in its event-driven (tag) mode."
    required: false
    default: ""
  claude_args:
    description: "CLI args forwarded to claude-code-action (--allowedTools, ... — NO --model; pass that as `model`)."
    required: false
    default: ""
  allowed_non_write_users:
    description: "Passthrough for claude-code-action allowed_non_write_users."
    required: false
    default: ""
  allowed_bots:
    description: "Passthrough for claude-code-action allowed_bots."
    required: false
    default: ""
  untrusted_input:
    description: >-
      Newline-separated entries naming this run's untrusted input (each is
      rendered as a bullet, so "label: /path (note)" is fine). An entry may be a
      file path OR a description, so a run whose untrusted input has no file — a
      comment body, a tool result — is still reachable. The canonical guard in
      .github/prompts/untrusted-data-preamble.md is prepended whatever this
      holds; leaving it empty only makes the listed entry generic. Declare WHICH
      inputs are untrusted; never restate the rule in your prompt.
    required: false
    default: ""
  skip_guard_reason:
    description: >-
      Waive the untrusted-data guard, with a stated reason. The guard is on by
      DEFAULT, so this is the only way a caller reaches the action unguarded, and
      the reason is what an auditor reads. Setting it alongside untrusted_input
      is a hard error. An empty prompt (claude-code-action's event-driven tag
      mode, where the action builds its own prompt) requires it.
    required: false
    default: ""
  gate_execution:
    description: >-
      Fail the run when its execution log reports is_error (or is missing,
      corrupt, or carries no result event). Defaults to "true": a green
      claude-code-action step is not proof Claude ran, so the gate belongs on by
      default. Set "false" only with a stated reason at the call site.
    required: false
    default: "true"
  gate_context:
    description: >-
      Label the gate puts in its error messages ("<context> ended in error ...").
      Empty falls back to the script's own "Claude run".
    required: false
    default: ""
outputs:
  execution_file:
    description: >-
      Execution-log path of the last attempt that ran (the highest rung that
      fired, else the primary's). Callers read it for cost reporting; the
      is_error check is already applied by the gate step below.
    value: ${{ steps.resolve_log.outputs.execution_file }}
  permission_denials:
    description: >-
      Permission-denial count from the gated run's execution log (empty when
      gate_execution is "false"). Never fatal on its own — a caller reads it to
      explain a run that produced no edits because tools were blocked.
    value: ${{ steps.gate.outputs.permission_denials }}
runs:
  using: "composite"
  steps:
    # Attach the canonical untrusted-data guard before any rung runs, so every
    # attempt sends the identical guarded prompt. The guard is prepended by
    # DEFAULT: a caller reaches the action unguarded only by stating a reason in
    # skip_guard_reason, so a new call site that declares nothing is guarded
    # rather than exposed.
    - name: Compose the prompt with the untrusted-data guard
      id: compose
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        UNTRUSTED_INPUT: ${{ inputs.untrusted_input }}
        SKIP_GUARD_REASON: ${{ inputs.skip_guard_reason }}
        PREAMBLE: ${{ github.action_path }}/../../prompts/untrusted-data-preamble.md
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/compose-claude-prompt.sh"
    # An empty `model` renders `--model` with no value, and claude-code-action
    # then runs on ITS default. Refusing here is the choke point: every caller
    # reaches the action through these rungs, so no present or future one can
    # spend an unpinned model.
    - name: Refuse an unpinned model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        # Stripped, not just unset: `--model` followed by whitespace renders the
        # same flag-with-no-value as the empty string does.
        [[ -n "${MODEL//[[:space:]]/}" ]] || {
          echo "::error::model input is empty — claude-code-action would run on its own default." >&2
          exit 1
        }
    # BEGIN GENERATED: credential ladder steps (.github/scripts/gen_credential_ladder.py) — do not edit by hand
    - name: Attempt with the metered API key
      id: a1
      if: inputs.api_key != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      with:
        anthropic_api_key: ${{ inputs.api_key }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
    - name: Did rung 1 run?
      id: c1
      # The SAME gate as the attempt, so a skipped rung's check emits an
      # empty verdict and the newest-first resolution below keeps
      # reporting the attempt that did run.
      if: inputs.api_key != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a1.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/../../resolver/claude-run-errored.sh"
    - name: Ladder state after rung 1
      id: s1
      shell: bash
      env:
        PRIOR: "true"
        ANY_PRIOR: "false"
        ERRORED: ${{ steps.c1.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"
        any="$ANY_PRIOR"
        [[ -n "$ERRORED" ]] && any="true"
        echo "any_attempt=${any}" >>"$GITHUB_OUTPUT"
    - name: Back off before rung 2
      # Skipped until some rung has actually run: before the first
      # attempt there is no blip to straddle, so the wait would only
      # idle a runner.
      if: >-
        steps.s1.outputs.still_needs_attempt == 'true' && (inputs.oauth_token != '' || steps.c1.outputs.zero_cost == 'true')
        && steps.s1.outputs.any_attempt == 'true'
      shell: bash
      env:
        BACKOFF_SECONDS: "10"
      run: sleep "$BACKOFF_SECONDS"
    - name: Attempt with credential rung 2
      id: a2
      if: steps.s1.outputs.still_needs_attempt == 'true' && (inputs.oauth_token != '' || steps.c1.outputs.zero_cost == 'true')
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157

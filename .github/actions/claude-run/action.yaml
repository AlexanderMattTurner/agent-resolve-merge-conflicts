      # The SAME gate as the attempt, so a skipped rung's check emits an
      # empty verdict and the newest-first resolution below keeps
      # reporting the attempt that did run.
      if: steps.s7.outputs.still_needs_attempt == 'true' && inputs.fallback_oauth_token_6 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a8.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/../../resolver/claude-run-errored.sh"
    - name: Ladder state after rung 8
      id: s8
      shell: bash
      env:
        PRIOR: ${{ steps.s7.outputs.still_needs_attempt }}
        ANY_PRIOR: ${{ steps.s7.outputs.any_attempt }}
        ERRORED: ${{ steps.c8.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"
        any="$ANY_PRIOR"
        [[ -n "$ERRORED" ]] && any="true"
        echo "any_attempt=${any}" >>"$GITHUB_OUTPUT"
    # END GENERATED: credential ladder steps
    # Resolve the winning rung's log ONCE. Both the `execution_file` output and
    # the gate below read this step, so the coalesce has a single source rather
    # than a copy per consumer that could drift apart.
    - name: Resolve the execution log of the rung that ran
      id: resolve_log
      shell: bash
      env:
        # BEGIN GENERATED: credential ladder execution-log (.github/scripts/gen_credential_ladder.py) — do not edit by hand
        EXEC_FILE: >-
          ${{ steps.a8.outputs.execution_file ||
              steps.a7.outputs.execution_file ||
              steps.a6.outputs.execution_file ||
              steps.a5.outputs.execution_file ||
              steps.a4.outputs.execution_file ||
              steps.a3.outputs.execution_file ||
              steps.a2.outputs.execution_file ||
              steps.a1.outputs.execution_file }}
        # END GENERATED: credential ladder execution-log
      run: echo "execution_file=${EXEC_FILE}" >>"$GITHUB_OUTPUT"
    # Propagate a hard failure only when NO attempt produced a non-errored run.
    # The cumulative ladder state (not step outcomes) carries the verdict:
    # claude-code-action exits 0 even on a dead token, so an outcome-based
    # condition would report success on a run that never reached inference.
    - name: Propagate failover result
      # BEGIN GENERATED: credential ladder propagate-gate (.github/scripts/gen_credential_ladder.py) — do not edit by hand
      if: steps.s8.outputs.still_needs_attempt == 'true'
      # END GENERATED: credential ladder propagate-gate
      shell: bash
      run: |
        echo "::error::claude-run: every configured Claude credential errored (set at least one of this action's credential inputs to a live credential)." >&2
        exit 1
    # A rung exiting 0 is NOT proof Claude ran: an auth failure, a crash before
    # the result event, and a corrupt log all leave the step green. This gate is
    # what turns that silent skip into a red step. It lives HERE, not at each
    # call site, so a new caller inherits it instead of having to remember it —
    # the obligation was previously open-coded and 5 of 7 call sites had missed
    # it. Removing this step re-opens every caller to a silent no-op run.
    - name: Gate on the execution log (is_error / missing / corrupt)
      id: gate
      if: inputs.gate_execution == 'true'
      shell: bash
      env:
        CONTEXT: ${{ inputs.gate_context }}
        EXECUTION_FILE: ${{ steps.resolve_log.outputs.execution_file }}
      run: /usr/bin/python3 "${GITHUB_ACTION_PATH}/../../resolver/checks/claude-execution.py"

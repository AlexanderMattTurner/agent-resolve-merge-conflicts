# actionlint's `github` context type table has no `job_workflow_sha`, so it
# reports the property as undefined. GitHub documents it — the commit SHA of the
# reusable workflow file the job is running — and it is what lets a caller pin
# this workflow once, on its own `uses:` line, instead of repeating the SHA in
# `resolver-ref`. The ignore is scoped to that one message on that one file, so
# every other expression in it is still typed.
paths:
  .github/workflows/auto-resolve.yaml:
    ignore:
      - 'property "job_workflow_sha" is not defined'

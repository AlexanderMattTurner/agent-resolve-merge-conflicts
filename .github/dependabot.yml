version: 2

# Only track a handful of npm packages for version updates.
# Security updates for all packages are handled separately by
# GitHub's Dependabot security alerts (enabled at the repo level).
#
# "Watch everything" generates weekly churn that maintainers tend to
# rubber-stamp, undermining the security goal. Default to security-only
# monitoring with explicit opt-in for packages you actively care about.

updates:
  # The second directory reaches the claude-code-action pin inside the
  # claude-run composite action, which a "/" entry alone never bumps.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # The Claude Code CLI the resolver installs. Its pin lives in its own
  # package.json so a weekly bump keeps the CLI able to run the newest models.
  - package-ecosystem: "npm"
    directory: "/.github/claude-cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    allow:
      - dependency-name: "@anthropic-ai/claude-code"

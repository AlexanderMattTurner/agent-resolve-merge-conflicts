\* Once every path is terminal, nothing is left to claim: no step out of such a
\* ledger changes anything. That is what lets a driver call
\* `require_fully_dispositioned` and then write its outputs.
\*
\* Stated over TERMINAL rather than over "claimed", because the obvious reading
\* -- once every path is claimed, no claim is enabled -- is FALSE of the shipped
\* ledger: a DEFERRED path is claimed and still has one claim to come.
\* ConflictLedger_handoff is that counterexample, so the two configs are a pair.
\* EXPECT-EXIT: 0
\* EXPECT-DISTINCT: 5,425
\* SUMMARY: holds — a ledger whose every path is terminal takes no further step
CONSTANT N = 2
INIT Init
NEXT Next
PROPERTY NoClaimOnceSettled

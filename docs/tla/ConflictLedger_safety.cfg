\* The safety scheme: the partitions never overlap and always cover the ledger,
\* each argument field belongs to the one state that owns it, a claimed path
\* never goes back to unclaimed, and a terminal entry never changes again.
\* Also checks that every state stays within its declared type.
\*
\* DisjointPartitions is the property the twenty bash arrays in prepare.sh did
\* NOT have: a path could sit in `llm_list` and `deferred_regen` at once. It
\* holds here BY CONSTRUCTION, because one disposition field cannot carry two
\* values -- the construction is the fix, and this config is what reds if a
\* later edit gives a path a second way into a partition. FieldsOwnedByState and
\* TerminalClaimIsFinal are different: each is a claim about the whole reachable
\* set, and either fails on a claim rule that let a second pass overwrite a path
\* or left a `to` behind on a staged one.
\* EXPECT-EXIT: 0
\* EXPECT-DISTINCT: 5,425
\* SUMMARY: holds — one disposition per path, the argument fields its state owns, and no second claim on a terminal path
CONSTANT N = 2
INIT Init
NEXT Next
INVARIANT Inv
PROPERTY ClaimsAreFinal

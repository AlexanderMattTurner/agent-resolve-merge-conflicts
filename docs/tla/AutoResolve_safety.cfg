\* resolution never is. Also checks that every state stays within its declared
\* type, and that a verdict is never rewritten once set.
\*
\* ConflictStandsImpliesStall is the theorem this module exists for. It is a
\* claim about the WHOLE reachable set, not about one row: a land ending or a
\* claim added to outcome.py with no arm ends a run classified NONE, and both
\* TerminalHasVerdict and this invariant then fail here.
\* EXPECT-EXIT: 0
\* EXPECT-DISTINCT: 85
\* SUMMARY: holds — every ending is classified, and every unresolved ending with nobody on the hook is a stall
